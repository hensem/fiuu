version: "3.9"

services:
  # 🧩 PHP / Laravel app
  app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: laravel_app
    depends_on:
      - db
    volumes:
      # Mount Laravel source code
      - ./src:/var/www/html
    networks:
      - laravel_net

  # 🌐 Nginx Web Server
  web:
    image: nginx:latest
    container_name: laravel_web
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      # Share same code as PHP container
      - ./src:/var/www/html
      # Use your custom Nginx config
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net

  # 🗄️ MySQL Database (Portable & Safe)
  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    command:
      [
        "mysqld",
        "--default-authentication-plugin=mysql_native_password",
        "--skip-name-resolve",
        "--log_bin_trust_function_creators=1",
        "--performance-schema=ON",
        "--secure-file-priv=",
        "--skip-host-cache"
      ]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    # 🔒 Use bind-mounted folder for portability
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - laravel_net

# 🧱 Define networks and volumes
networks:
  laravel_net:
    driver: bridge
